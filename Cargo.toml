[workspace]
resolver = "2"
members = [
    "crates/frontrunner",
    "crates/mempool",
    "crates/simulator",
    "crates/executor",
    "crates/types",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Frontrunner Team"]
license = "MIT"
repository = "https://github.com/0xSero/generalized-frontrunner"

[workspace.dependencies]
# Ethereum libraries
ethers = { version = "2.0", features = ["ws", "rustls", "abigen", "ethers-solc"] }
alloy = "0.1"
revm = { version = "7.1", features = ["serde"] }
revm-inspectors = "0.2"

# Async runtime
tokio = { version = "1.35", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "migrate", "chrono"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Metrics
prometheus = "0.13"
axum = { version = "0.7", features = ["macros"] }

# Utilities
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Cryptography (for flashbots)
hex = "0.4"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
